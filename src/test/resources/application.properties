# Test / no-MySQL profile: uses an in-memory H2 database.
# Used by the test suite and by `./mvnw spring-boot:test-run` (see TestAgoraBackendApplication).
spring.datasource.url=jdbc:h2:mem:agora;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE,YEAR
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

server.port=${PORT:8080}
spring.application.name=agora-backend
spring.docker.compose.enabled=false

application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000

app.cors.allowed-origins=http://localhost:5173,http://localhost:4173

file.upload-dir=./target/test-uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

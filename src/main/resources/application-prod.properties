# Production profile (activated with -Dspring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod)
#
# Secrets are read from environment variables - set these on the hosting platform (e.g. Render):
#   DB_PASSWORD               - Aiven MySQL password
#   JWT_SECRET_KEY            - base64/hex key, at least 256 bits
#   APP_CORS_ALLOWED_ORIGINS  - comma separated list of frontend URLs allowed to call the API

# Database - Aiven MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://agora-mysql-atiasekekeli-f88c.c.aivencloud.com:11894/defaultdb?useSSL=true&requireSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# App
server.port=${PORT:10000}
spring.application.name=agora-backend
spring.docker.compose.enabled=false

# JWT
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=86400000

# CORS - frontend origins allowed to call the API
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# File Upload
file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
